services:
  - type: web
    name: connexa
    runtime: docker
    dockerfilePath: ./app/Dockerfile
    dockerContext: ./app
    # Free tier: no persistent disk, and the instance sleeps after 15 minutes
    # idle. Keep it warm with an external cron pinging /api/health every
    # 10 minutes. Any restart still resets the SQLite file — see DEPLOY.md.
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: CONNEXA_SECRET
        generateValue: true
      - key: CONNEXA_DB_PATH
        value: /data/connexa.db
      # Demo affordances must be off on a public host.
      - key: CONNEXA_DEMO_LOGIN
        value: "0"
      # Launch with real users only — no seeded profiles.
      - key: CONNEXA_AUTOSEED
        value: "0"
      - key: FIREBASE_PROJECT_ID
        value: connect-me-93fda
